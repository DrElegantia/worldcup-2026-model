name: Aggiornamento giornaliero simulazione

on:
  schedule:
    - cron: "0 6 * * *"      # ogni giorno 06:00 UTC
  workflow_dispatch: {}        # avvio manuale

permissions:
  contents: write

concurrency:
  group: daily-sim
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Genera snapshot giornaliero (100k Monte Carlo)
        run: python src/run_daily.py

      - name: Commit e push snapshot
        run: |
          git config user.name "wc2026-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sims docs
          if git diff --cached --quiet; then
            echo "Nessuna modifica."
          else
            git commit -m "snapshot simulazione $(date -u +%F)"
            git push
          fi
